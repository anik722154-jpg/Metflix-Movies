<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metflix - Entertainment Redefined</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #b20710;
            --bg-body: #111113;
            --bg-card: #18181b;
            --bg-surface: #27272a;
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --border: #2f2f35;
            --nav-height: 72px;
        }

        [data-theme="light"] {
            --bg-body: #f4f5f8;
            --bg-card: #ffffff;
            --bg-surface: #eaecef;
            --text-main: #111318;
            --text-sub: #606575;
            --border: #dcdfe6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* ================= STUDIO INTRO ================= */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.77, 0, 0.175, 1), transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .loader-overlay.fade-out {
            opacity: 0;
            transform: scale(1.08);
            visibility: hidden;
        }

        .intro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: studioZoom 1.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            text-align: center;
        }

        .intro-logo-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(229, 9, 20, 0.8);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .intro-title {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 5px;
            text-shadow: 0 5px 25px rgba(0,0,0,0.9);
            animation: textFadeUp 1s ease-out;
        }

        .intro-subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: textFadeUp 1.2s ease-out;
        }

        .intro-progress-track {
            width: 180px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 25px;
            overflow: hidden;
            position: relative;
        }

        .intro-progress-track::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: var(--primary);
            border-radius: 4px;
            animation: introSlide 1s infinite ease-in-out;
        }

        @keyframes studioZoom {
            0% { opacity: 0; transform: scale(0.85); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(229, 9, 20, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 60px rgba(229, 9, 20, 0.9); transform: scale(1.03); }
        }

        @keyframes textFadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes introSlide {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        /* ================= NAVBAR ================= */
        .navbar {
            height: var(--nav-height);
            background: rgba(17, 17, 19, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDownNav 0.6s ease-out;
        }

        @keyframes slideDownNav {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .brand:hover { transform: scale(1.02); }

        .nav-logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
        }

        .brand-group { display: flex; flex-direction: column; }
        .brand-text { font-weight: 900; font-size: clamp(1.1rem, 2.2vw, 1.4rem); color: var(--primary); letter-spacing: 1.5px; line-height: 1.1; }
        .brand-tagline { font-size: 7.5px; color: var(--text-sub); letter-spacing: 2px; text-transform: uppercase; }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 14px;
            width: 100%;
            max-width: 280px;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 12px rgba(229, 9, 20, 0.25); }
        .search-box input { background: transparent; border: none; outline: none; color: var(--text-main); width: 100%; font-size: 14px; }

        .nav-actions { display: flex; align-items: center; gap: 10px; }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .icon-btn:hover { border-color: var(--primary); color: var(--primary); transform: rotate(15deg) scale(1.1); }

        /* ================= HERO BANNER ================= */
        .hero-banner {
            position: relative;
            height: clamp(380px, 50vw, 500px);
            background-size: cover;
            background-position: center top;
            display: flex;
            align-items: flex-end;
            padding: 40px 4%;
            transition: background-image 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(17,17,19,0.1) 15%, var(--bg-body) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 680px;
            animation: heroContentFade 0.8s ease-out;
        }

        @keyframes heroContentFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .hero-badges-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .badge-tag {
            background: var(--primary);
            color: #fff;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .rating-pill {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            color: #fbbf24;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .hero-title { font-size: clamp(2rem, 4.5vw, 2.8rem); font-weight: 900; margin-bottom: 8px; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .hero-desc {
            color: var(--text-sub);
            font-size: clamp(0.95rem, 1.8vw, 1.05rem);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 18px;
        }

        .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }

        .hero-play-btn, .hero-download-btn, .hero-list-btn {
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-play-btn { background: #ffffff; color: #000000; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
        .hero-play-btn:hover { background: var(--primary); color: #fff; transform: translateY(-3px) scale(1.05); }

        .hero-download-btn { background: rgba(255, 255, 255, 0.15); color: #fff; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.3); }
        .hero-download-btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-3px); }

        .hero-list-btn { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; }
        .hero-list-btn:hover { border-color: #fff; background: rgba(0, 0, 0, 0.8); transform: translateY(-3px); }

        /* ================= CATEGORY TABS ================= */
        .season-tabs {
            display: flex;
            gap: 10px;
            padding: 18px 4%;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .season-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--bg-card);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active, .tab-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3); }

        /* ================= MOVIE GRID & CARDS ================= */
        .container { padding: 30px 4%; flex: 1; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-title { font-size: clamp(1.2rem, 2.2vw, 1.4rem); font-weight: 700; letter-spacing: 0.5px; }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: cardAppear 0.6s ease-out backwards;
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 15px 35px rgba(229, 9, 20, 0.3);
            z-index: 10;
        }

        .movie-thumb-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
        .movie-thumb-wrapper img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .movie-card:hover .movie-thumb-wrapper img { transform: scale(1.1); }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .movie-card:hover .play-overlay { opacity: 1; }

        .play-btn-circle {
            width: 44px;
            height: 44px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.6);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .movie-card:hover .play-btn-circle { transform: scale(1); }

        .card-actions-top {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            z-index: 5;
        }

        .action-icon-btn {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .action-icon-btn:hover { background: var(--primary); border-color: var(--primary); transform: scale(1.1); }
        .action-icon-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .movie-info { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
        .movie-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-sub); }
        .movie-tag { color: #46d369; font-weight: 700; text-transform: uppercase; }
        .movie-title { font-size: 14.5px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ================= VIDEO PLAYER MODAL ================= */
        .player-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.4s ease;
        }
        .player-modal.active {
            display: flex;
            background: rgba(0, 0, 0, 0.94);
            animation: modalFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes modalFadeIn {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(8px); }
        }

        .draggable-window {
            width: 94%;
            max-width: 1000px;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95);
            border: 1px solid #333;
            position: absolute;
            animation: windowScaleUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes windowScaleUp {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .player-header {
            height: 48px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            cursor: grab;
        }
        .player-header:active { cursor: grabbing; }

        .player-title { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
        .close-player { font-size: 18px; color: #aaa; cursor: pointer; transition: all 0.3s ease; }
        .close-player:hover { color: var(--primary); transform: rotate(90deg) scale(1.2); }

        .video-container { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        .popout-blocker { position: absolute; top: 0; right: 0; width: 75px; height: 75px; z-index: 10; background: transparent; }

        /* Mobile Responsive Overrides */
        @media (max-width: 768px) {
            .draggable-window {
                width: 100% !important;
                height: 100% !important;
                max-width: 100% !important;
                border-radius: 0 !important;
                border: none !important;
                top: 0 !important;
                left: 0 !important;
                position: fixed !important;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .player-header { cursor: default !important; height: 50px; }
            .video-container { width: 100%; height: auto; aspect-ratio: 16 / 9; max-height: 85vh; }
        }
    </style>
</head>

    </div>

                    link: "https://drive.google.com/file/d/1K3tMALjp3EJaOZpT37_53rWsCcucfUEU/view?usp=drivesdk", 
                    thumb: "https://tse2.mm.bing.net/th/id/OIP.EdX2PbU2WZZlOwg6wOAK7wHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3", 
                    desc: "A benevolent goon goes to medical college to fulfill his father's dream of seeing him become a doctor, bringing healing through compassion and humor.",
                    year: "2003",
                    duration: "2h 36m",
                    rating: "8.1"
                }
            ]
        };

        function loadMovies() {
            try {
                const savedData = localStorage.getItem(STORAGE_KEY);
                return savedData ? JSON.parse(savedData) : defaultDatabase;
            } catch (e) {
                return defaultDatabase;
            }
        }

        function loadMyList() {
            try {
                const savedList = localStorage.getItem(MYLIST_KEY);
                return savedList ? JSON.parse(savedList) : [];
            } catch (e) {
                return [];
            }
        }

        function saveMyList(list) {
            localStorage.setItem(MYLIST_KEY, JSON.stringify(list));
        }

        const movieDatabase = loadMovies();
        let myList = loadMyList();
        let currentCategory = 'movies';

        // Dynamic Hero Slideshow
        let heroIndex = 0;
        let currentHeroMovie = null;

        function updateHeroBanner() {
            const allMovies = movieDatabase['movies'] || [];
            if (allMovies.length === 0) return;

            currentHeroMovie = allMovies[heroIndex % allMovies.length];
            const banner = document.getElementById('heroBanner');
            
            banner.style.opacity = '0.4';
            setTimeout(() => {
                banner.style.backgroundImage = `url('${currentHeroMovie.thumb}')`;
                document.getElementById('heroTitle').innerText = currentHeroMovie.title;
                document.getElementById('heroDesc').innerText = currentHeroMovie.desc || "Stream your favorite cinema instantly in HD quality.";
                document.getElementById('heroRating').innerText = currentHeroMovie.rating || "7.4";
                banner.style.opacity = '1';
                updateHeroListButtonState();
            }, 300);

            heroIndex++;
        }

        setInterval(updateHeroBanner, 6000);
        updateHeroBanner();

        function playCurrentHeroMovie() {
            if (currentHeroMovie) {
                openPlayer(currentHeroMovie.title, currentHeroMovie.link);
            }
        }

        function downloadCurrentHeroMovie() {
            if (currentHeroMovie) {
                triggerDownload(currentHeroMovie.title, currentHeroMovie.link);
            }
        }

        function triggerDownload(title, rawUrl) {
            let downloadUrl = rawUrl;
            if (rawUrl.includes('drive.google.com')) {
                const match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    downloadUrl = `https://drive.google.com/uc?export=download&id=${match[1]}`;
                }
            }
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.target = '_blank';
            a.download = `${title}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function isItemInMyList(id) {
            return myList.some(item => item.id === id);
        }

        function toggleMyList(event, movie) {
            event.stopPropagation();
            if (isItemInMyList(movie.id)) {
                myList = myList.filter(item => item.id !== movie.id);
            } else {
                myList.push(movie);
            }
            saveMyList(myList);
            renderMovies(currentCategory);
            updateHeroListButtonState();
        }

        function toggleHeroList() {
            if (currentHeroMovie) {
                if (isItemInMyList(currentHeroMovie.id)) {
                    myList = myList.filter(item => item.id !== currentHeroMovie.id);
                } else {
                    myList.push(currentHeroMovie);
                }
                saveMyList(myList);
                updateHeroListButtonState();
                if (currentCategory === 'mylist') {
                    renderMovies('mylist');
                }
            }
        }

        function updateHeroListButtonState() {
            if (!currentHeroMovie) return;
            const inList = isItemInMyList(currentHeroMovie.id);
            const icon = document.getElementById('heroListIcon');
            const text = document.getElementById('heroListText');
            if (inList) {
                icon.className = 'fas fa-check';
                text.innerText = 'In My List';
            } else {
                icon.className = 'fas fa-plus';
                text.innerText = 'My List';
            }
        }

        function renderMovies(categoryKey, searchQuery = '') {
            const grid = document.getElementById('moviesGrid');
            const movieCount = document.getElementById('movieCount');
            grid.innerHTML = '';

            let movies = categoryKey === 'mylist' ? myList : (movieDatabase[categoryKey] || []);

            if (searchQuery.trim() !== '') {
                movies = movies.filter(m => m.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            movieCount.innerText = `${movies.length} Title${movies.length === 1 ? '' : 's'}`;

            if (movies.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px 0;">No titles found in this section.</div>`;
                return;
            }

            movies.forEach((movie, index) => {
                const inList = isItemInMyList(movie.id);
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.style.animationDelay = `${index * 0.08}s`;
                card.onclick = () => openPlayer(movie.title, movie.link);
                
                card.innerHTML = `
                    <div class="movie-thumb-wrapper">
                        <img src="${movie.thumb}" alt="${movie.title}">
                        <div class="card-actions-top">
                            <button class="action-icon-btn" title="Download Movie" onclick="event.stopPropagation(); triggerDownload('${movie.title}', '${movie.link}')">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="action-icon-btn ${inList ? 'active' : ''}" title="${inList ? 'Remove from My List' : 'Add to My List'}" onclick="toggleMyList(event, ${JSON.stringify(movie).replace(/"/g, '&quot;')})">
                                <i class="fas ${inList ? 'fa-check' : 'fa-plus'}"></i>
                            </button>
                        </div>
                        <div class="play-overlay">
                            <div class="play-btn-circle"><i class="fas fa-play"></i></div>
                        </div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-meta">
                            <span class="movie-tag">4K HD</span>
                            <span><i class="fas fa-star" style="color: #fbbf24; font-size: 9px;"></i> ${movie.rating || '7.4'} • ${movie.year || '2023'}</span>
                        </div>
                        <div class="movie-title">${movie.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchCategory(event, categoryKey) {
            currentCategory = categoryKey;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            const titleMap = {
                movies: "All Movies",
                bollywood: "Bollywood Movies",
                mylist: "My Watchlist"
            };
            document.getElementById('currentCategoryTitle').innerText = titleMap[categoryKey] || `${categoryKey.toUpperCase()} Catalog`;
            renderMovies(categoryKey);
        }

        function filterMovies() {
            const query = document.getElementById('searchInput').value;
            renderMovies(currentCategory, query);
        }

        function openPlayer(title, rawUrl) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('movieIframe');
            document.getElementById('playerTitle').innerText = title;

            let finalStreamUrl = rawUrl;
            if (rawUrl.includes('drive.google.com')) {
                const match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    finalStreamUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            }

            iframe.src = finalStreamUrl;
            modal.classList.add('active');

            const win = document.getElementById('draggableWindow');
            if (window.innerWidth > 768) {
                win.style.top = `${(window.innerHeight - win.offsetHeight) / 2}px`;
                win.style.left = `${(window.innerWidth - win.offsetWidth) / 2}px`;
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('movieIframe');
            modal.classList.remove('active');
            setTimeout(() => {
                iframe.src = '';
            }, 400);
        }

        // Draggable Window Logic (PC / Tablet)
        const draggableWindow = document.getElementById('draggableWindow');
        const playerHeader = document.getElementById('playerHeader');
        let isDragging = false, startX, startY, initialX, initialY;

        playerHeader.addEventListener('mousedown', (e) => {
            if (window.innerWidth <= 768) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialX = draggableWindow.offsetLeft;
            initialY = draggableWindow.offsetTop;
            draggableWindow.style.position = 'absolute';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            draggableWindow.style.left = `${initialX + dx}px`;
            draggableWindow.style.top = `${initialY + dy}px`;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        function toggleTheme() {
            const html = document.documentElement;
            const themeBtn = document.getElementById('themeToggle');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                html.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        let isAudioOn = false;
        function toggleAudio() {
            isAudioOn = !isAudioOn;
            const btn = document.getElementById('audioToggleBtn');
            if (isAudioOn) {
                btn.innerHTML = '<i class="fas fa-volume-up" style="color: var(--primary);"></i>';
                btn.title = "Theater Atmosphere: ON";
            } else {
                btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                btn.title = "Theater Atmosphere: OFF";
            }
        }

        renderMovies('movies');
    </script>
</body>
</html>
